[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:aideck-api]
command=uv run python -m aideck.api --host 0.0.0.0 --port 8000
directory=/app
user=aideck
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/aideck-api.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=PYTHONPATH=/app/src
priority=100

[program:aideck-worker]
command=uv run python -m aideck.worker
directory=/app
user=aideck
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/aideck-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=PYTHONPATH=/app/src
priority=200

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/nginx.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
priority=300

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock
