[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:aideck-main]
command=uv run python -m aideck.start
directory=/app
user=aideck
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/aideck-main.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=PYTHONPATH=/app/src,DISPLAY=:0
priority=100

[program:aideck-api]
command=uv run python -m aideck.api --host 0.0.0.0 --port 8000
directory=/app
user=aideck
autostart=false
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/aideck-api.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=PYTHONPATH=/app/src
priority=200

[program:aideck-scheduler]
command=uv run python -m aideck.scheduler
directory=/app
user=aideck
autostart=false
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/aideck-scheduler.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=PYTHONPATH=/app/src
priority=300

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0770
chown=root:aideck

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
